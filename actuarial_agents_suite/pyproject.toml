[project]
name = "actuarial-agents-suite"
version = "0.1.0"
description = "Actuarial practitioner agents (Agno + Gemini) with Agent Skills integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agno>=2.2.10",
    "ddgs>=9.0.0",
    "duckdb>=1.1.0",
    "google-genai>=1.68.0",
    "google-generativeai>=0.8.3",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.10.2",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "playwright>=1.49.0",
    "streamlit>=1.41.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
